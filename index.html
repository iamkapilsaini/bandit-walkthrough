
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Interactive OverTheWire Bandit walkthrough and solutions.">

    <title>Bandit Walkthrough</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Highlight.js theme -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

<header class="topbar">

    <div class="brand">
        <div class="brand-title">
            <span class="terminal-symbol">&gt;_</span>
            <span>Bandit Walkthrough</span>
        </div>

        <span class="brand-subtitle">
            OverTheWire • Linux • Security
        </span>
    </div>

    <div class="topbar-right">

        <a
            href="https://github.com/iamkapilsaini/"
            target="_blank"
            rel="noopener noreferrer"
            class="profile-link"
        >
            Repo
        </a>

        <a
            href="https://github.com/iamkapilsaini/bandit-walkthrough"
            target="_blank"
            rel="noopener noreferrer"
            class="github-btn"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
            >
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.01c-3.2.69-3.88-1.54-3.88-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18A10.9 10.9 0 0 1 12 8.32c.97 0 1.94.13 2.85.38 2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.67.41.36.78 1.07.78 2.16v3.2c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>

            <span>GitHub</span>
        </a>

    </div>

</header>

    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <div class="app">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="sidebar-title">
                    <span class="terminal-dot"></span>
                    BANDIT LEVELS
                </div>

                <button
                    id="mobileClose"
                    class="mobile-close"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <!-- Progress -->

            <div class="progress-section">

                <div class="progress-header">

                    <span>Progress</span>

                    <span id="progressText">
                        0 / 34
                    </span>

                </div>

                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- Search -->

            <div class="search-container">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="levelSearch"
                    placeholder="Search levels..."
                    autocomplete="off"
                >

            </div>


            <!-- Level navigation -->

            <nav
                id="levelList"
                class="level-list"
                aria-label="Bandit levels"
            >
                <!-- JavaScript generates levels here -->
            </nav>


            <div class="sidebar-footer">

                <span>OverTheWire</span>

                <a
                    href="https://overthewire.org/wargames/bandit/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Official Bandit
                </a>

            </div>

        </aside>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <main class="content-area">


            <!-- Mobile menu -->

            <button
                id="mobileMenu"
                class="mobile-menu"
            >
                ☰
                <span>Levels</span>
            </button>


            <!-- Content -->

            <article
                id="content"
                class="content"
            >

                <!-- Loading screen -->

                <div class="welcome-screen">

                    <div class="welcome-icon">
                        >
                    </div>

                    <h2>Bandit Walkthrough</h2>

                    <p>
                        Select a level from the left sidebar
                        to view the walkthrough.
                    </p>

                    <div class="welcome-command">
                        <span>$</span>
                        select-level
                    </div>

                </div>

            </article>


            <!-- =================================================
                 PREVIOUS / NEXT
            ================================================== -->

            <div
                id="navigation"
                class="content-navigation"
            >

                <button
                    id="previousButton"
                    class="nav-button previous"
                >
                    <span>←</span>

                    <div>
                        <small>Previous</small>
                        <strong id="previousText">
                            Previous Level
                        </strong>
                    </div>

                </button>


                <button
                    id="nextButton"
                    class="nav-button next"
                >

                    <div>
                        <small>Next</small>
                        <strong id="nextText">
                            Next Level
                        </strong>
                    </div>

                    <span>→</span>

                </button>

            </div>

        </main>

    </div>


    <!-- =====================================================
         MARKDOWN PARSER
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <!-- =====================================================
         SYNTAX HIGHLIGHTING
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js">
    </script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>
</html>
